  <body>
    <a class="skip-link" href="#main">跳到信的内容</a>

    <div
      id="lock-screen"
      class="lock-screen"
      data-lock-screen
      role="dialog"
      aria-modal="true"
      aria-labelledby="lock-title"
    >
      <div class="lock-screen__card">
        <span class="lock-screen__seal" aria-hidden="true">A·G</span>
        <h2 id="lock-title" class="lock-screen__title">一封私人信件</h2>
        <p class="lock-screen__subtitle">输入四位数字暗号，拆开这封信</p>
        <form class="lock-screen__form" data-lock-form autocomplete="off">
          <input
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            class="lock-screen__input"
            data-lock-input
            placeholder="· · · ·"
            aria-label="四位拆信暗号"
            autofocus
          />
          <button type="submit" class="lock-screen__button">拆信</button>
        </form>
        <p class="lock-screen__error" data-lock-error aria-live="polite"></p>
      </div>
    </div>

      <div class="opening__paper" aria-hidden="true"></div>
      <div class="opening__vignette" aria-hidden="true"></div>
